[package]
name = "cuda_tags"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Pinewood Robotics (FRC 4765)"]
description = "Safe Rust API for CudaTags, Team 971's GPU tag36h11 AprilTag detector"
license = "Apache-2.0"
repository = "https://github.com/PinewoodRobotics/CudaTags"
readme = "../../../README.md"
# build.rs compiles the C++/CUDA sources from the repository root
# (../../..), so the crate is used by path or git, not from crates.io.
publish = false
links = "cuda_tags"

[lib]
name = "cuda_tags"
path = "src/lib.rs"

[features]
default = []
# Build the GPU detector with CMake, nvcc and OpenCV. Without this feature,
# or when the target is not Linux or no CUDA toolkit is found, the crate
# builds a stub whose Detector::new returns Error::Unavailable, so dependent
# workspaces build and test anywhere. Set CUDA_TAGS_REQUIRE_CUDA=1 to make a
# missing toolkit a build error instead.
cuda = []

[build-dependencies]
pkg-config = "0.3"

[[example]]
name = "detect_pgm"
path = "examples/detect_pgm.rs"
